<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7, #c9a7eb);
    background-size: 200% 200%;
    animation: gradientMove 12s ease infinite;
    text-align: center;
    padding: 20px;
  }

  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .foto {
    width: 220px;
    height: 220px;
    object-fit: cover;
    border-radius: 50%;
    border: 5px solid white;
    box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    margin-bottom: 25px;
  }

  h1 {
    color: white;
    text-shadow: 0 2px 6px rgba(0,0,0,0.3);
    font-size: 1.6em;
    margin-bottom: 30px;
  }

  button {
    background: white;
    color: #c9a7eb;
    border: none;
    padding: 14px 32px;
    border-radius: 30px;
    font-size: 1em;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    transition: transform 0.2s;
  }

  button:hover { transform: scale(1.05); }

  #estado {
    margin-top: 20px;
    color: white;
    font-size: 0.9em;
    opacity: 0.9;
  }
</style>
</head>
<body>

  <img class="foto" src="foto.jpg" alt="Nuestra foto">
  <h1>Para ti ❤️</h1>

  <button onclick="reproducirAleatorio()">Reproducir</button>
  <p id="titulo"></p>

  <audio id="reproductor"></audio>

  <script>
    // Pon aquí tus audios: archivo (dentro de /audios/) y el título que quieres que se vea
    const audios = [
      { archivo: "audios/audio1.m4a", titulo: "Buenos días 💛" },
      { archivo: "audios/audio2.m4a", titulo: "Te quiero" }
    ];

    function reproducirAleatorio() {
      const elegido = audios[Math.floor(Math.random() * audios.length)];
      const reproductor = document.getElementById("reproductor");
      reproductor.src = elegido.archivo;
      reproductor.play();
      document.getElementById("titulo").textContent = elegido.titulo;
    }
  </script>

</body>
</html>
